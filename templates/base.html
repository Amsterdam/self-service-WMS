<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Self-Service WMS – Gemeente Amsterdam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:     #EC0000;
      --red-dk:  #b30000;
      --ink:     #1a1a1a;
      --ink-2:   #444;
      --ink-3:   #777;
      --border:  #d8d8d8;
      --surface: #f5f5f5;
      --white:   #ffffff;
      --step-done: #007A3D;
      --font-body: 'DM Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
      --radius: 3px;
      --shadow: 0 2px 12px rgba(0,0,0,.08);
    }

    body {
      font-family: var(--font-body);
      background: #f0f0f0;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────────── */
    header {
      background: var(--white);
      border-bottom: 3px solid var(--red);
      padding: 0 40px;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow);
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo img {
      height: 38px;
      width: auto;
      display: block;
    }

    header h1 {
      font-size: 16px;
      font-weight: 500;
      color: var(--ink-2);
      border-left: 1px solid var(--border);
      padding-left: 20px;
      margin-left: 4px;
    }

    /* ── Stepper ─────────────────────────────────── */
    .stepper {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      display: flex;
      align-items: center;
      overflow-x: auto;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-3);
      white-space: nowrap;
    }

    .step-arrow {
      color: var(--border);
      font-size: 16px;
      padding: 0 14px;
      line-height: 1;
      flex-shrink: 0;
    }

    .step.active { color: var(--red); }
    .step.done   { color: var(--step-done); }

    .step-num {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 2px solid currentColor;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .step.done .step-num {
      background: var(--step-done);
      border-color: var(--step-done);
      color: white;
      font-size: 13px;
    }

    /* ── Main ───────────────────────────────────── */
    main {
      flex: 1;
      max-width: 860px;
      width: 100%;
      margin: 40px auto;
      padding: 0 24px;
    }

    .card {
      background: var(--white);
      border-radius: 10px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .card-header { padding: 28px 36px 0; }
    .card-body   { padding: 28px 36px 36px; }

    /* ── Typography ─────────────────────────────── */
    h2 {
      font-size: 22px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--ink-3);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .info-box {
      background: #fff8f8;
      border-left: 3px solid var(--red);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 14px 18px;
      font-size: 13.5px;
      color: var(--ink-2);
      line-height: 1.65;
      margin-bottom: 28px;
    }

    .info-box strong { color: var(--red); display: block; margin-bottom: 4px; }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin: 28px 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-label::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Form ───────────────────────────────────── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    .form-group.full { grid-column: 1 / -1; }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-2);
      letter-spacing: .03em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label .req { color: var(--red); }

    input[type="text"],
    input[type="number"],
    input[type="url"] {
      height: 42px;
      padding: 0 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: 14px;
      color: var(--ink);
      background: var(--white);
      transition: border-color .15s, box-shadow .15s;
      outline: none;
      width: 100%;
    }

    input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(236,0,0,.08);
    }

    input.color-input {
      font-family: var(--font-mono);
      letter-spacing: .04em;
    }

    /* Tooltip */
    .tooltip-icon {
      display: inline-flex;
      width: 16px; height: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--ink-3);
      cursor: help;
      position: relative;
    }

    .tooltip-icon:hover .tooltip-text {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .tooltip-text {
      position: absolute;
      left: 22px;
      top: -4px;
      background: var(--ink);
      color: #fff;
      font-size: 12px;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      padding: 8px 12px;
      border-radius: var(--radius);
      width: 260px;
      line-height: 1.5;
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition: opacity .2s, transform .2s;
      z-index: 50;
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
    }

    /* Color swatch */
    .color-preview { display: flex; gap: 8px; align-items: center; }
    .color-preview input { flex: 1; }
    .swatch {
      width: 42px; height: 42px;
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
      flex-shrink: 0;
      transition: background .1s;
    }

    /* ── Buttons ────────────────────────────────── */
    .btn-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--surface);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 44px;
      padding: 0 24px;
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, transform .1s;
      border: none;
      text-decoration: none;
    }

    .btn:active { transform: scale(.98); }

    .btn-primary  { background: var(--red); color: white; }
    .btn-primary:hover { background: var(--red-dk); }

    .btn-secondary {
      background: var(--surface);
      color: var(--ink-2);
      border: 1.5px solid var(--border);
    }
    .btn-secondary:hover { background: var(--border); }

    /* ── Fetch result panel ─────────────────────── */
    .result-panel {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-top: 20px;
      display: none;
    }

    .result-panel.visible { display: block; }

    .result-panel h4 {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 12px;
    }

    .result-row {
      display: flex;
      gap: 12px;
      align-items: baseline;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .result-row:last-child { border-bottom: none; }

    .result-key {
      font-weight: 600;
      color: var(--ink-2);
      min-width: 150px;
      flex-shrink: 0;
    }

    .result-val {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink);
      word-break: break-all;
    }

    .tag-ok  { color: #007A3D; font-weight: 700; }
    .tag-err { color: var(--red); font-weight: 700; }

    .error-msg {
      color: var(--red);
      font-size: 13px;
      margin-top: 8px;
      padding: 10px 14px;
      background: #fff0f0;
      border-radius: var(--radius);
      border: 1px solid #f5c0c0;
    }

    /* Spinner */
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Mapfile output ─────────────────────────── */
    .mapfile-output {
      font-family: var(--font-mono);
      font-size: 12.5px;
      background: #1a1a2e;
      color: #e0e0ff;
      border-radius: var(--radius);
      padding: 20px 24px;
      overflow-x: auto;
      white-space: pre;
      line-height: 1.7;
      margin-top: 16px;
      max-height: 480px;
      overflow-y: auto;
    }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      header { padding: 0 20px; }
      main { margin: 20px auto; }
      .card-body { padding: 20px; }
      .stepper { padding: 0 20px; }
    }
  </style>
</head>
<body>

<header>
  <a href="https://www.amsterdam.nl" target="_blank" class="logo" aria-label="Gemeente Amsterdam">
    <svg width="72" height="40" viewBox="0 0 72 40" xmlns="http://www.w3.org/2000/svg">
      <!-- Drie Andreaskruisen (×) boven elkaar met meer ruimte -->
      <line x1="1"  y1="2"  x2="9"  y2="11" stroke="#EC0000" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="9"  y1="2"  x2="1"  y2="11" stroke="#EC0000" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="1"  y1="15" x2="9"  y2="24" stroke="#EC0000" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="9"  y1="15" x2="1"  y2="24" stroke="#EC0000" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="1"  y1="28" x2="9"  y2="37" stroke="#EC0000" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="9"  y1="28" x2="1"  y2="37" stroke="#EC0000" stroke-width="2.8" stroke-linecap="round"/>
      <!-- Tekst naast de kruisen -->
      <text x="15" y="14" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#EC0000">Gemeente</text>
      <text x="15" y="28" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#EC0000">Amsterdam</text>
    </svg>
  </a>
  <h1>Self-Service WMS Team GEO</h1>
</header>

{% block stepper %}{% endblock %}

<main>
  {% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
</body>
</html>
